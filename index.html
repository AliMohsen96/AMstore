// ─── SUPABASE HOOK ────────────────────────────────────────────────────────────
function useTable(tableName, orderBy = "created_at") {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);

  const fetchData = useCallback(async () => {
    const { data: rows, error } = await supabase
      .from(tableName)
      .select("*")
      .order(orderBy, { ascending: false });
    if (!error) setData(rows || []);
    setLoading(false);
  }, [tableName, orderBy]);

  useEffect(() => {
    fetchData();
    // Real-time subscription
    const channel = sb
      .channel(`rt-${tableName}`)
      .on("postgres_changes", { event: "*", schema: "public", table: tableName }, fetchData)
      .subscribe();
    return () => sb.removeChannel(channel);
  }, [fetchData, tableName]);

  const insert = async (row) => {
    const { error } = await sb.from(tableName).insert(row);
    if (error) { alert("خطأ: " + error.message); return false; }
    return true;
  };

  const update = async (id, changes) => {
    const { error } = await sb.from(tableName).update(changes).eq("id", id);
    if (error) { alert("خطأ: " + error.message); return false; }
    return true;
  };

  const remove = async (id) => {
    const { error } = await sb.from(tableName).delete().eq("id", id);
    if (error) { alert("خطأ: " + error.message); return false; }
    return true;
  };

  return { data, loading, insert, update, remove, refresh: fetchData };
}

function getStatusBadge(status) {
  if (!status) return null;
  if (status.includes("مكتمل") || status.includes("مدفوع بالكامل") || status.includes("تم التسليم")) return <span className="badge-green">{status}</span>;
  if (status.includes("جزئياً") || status.includes("جارى")) return <span className="badge-orange">{status}</span>;
  if (status.includes("لم يدفع") || status.includes("ملغى") || status.includes("غير مدفوع")) return <span className="badge-red">{status}</span>;
  if (status.includes("معلق")) return <span className="badge-blue">{status}</span>;
  return <span className="badge-gold">{status}</span>;
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({ orders, orderItems, expenses, products, safeLog }) {
  const totalSales   = orders.reduce((s,o)=>s+(o.net||0),0);
  const grossProfit  = orderItems.reduce((s,i)=>s+i.qty*((i.price||0)-(i.cost||0)),0);
  const totalExp     = expenses.reduce((s,e)=>s+(e.amount||0),0);
  const safeBalance  = safeLog.reduce((s,e)=>e.direction==="وارد"?s+(e.amount||0):s-(e.amount||0),0);
  const inventoryVal = products.reduce((s,p)=>s+(p.stock||0)*(p.cost||0),0);
  const lowStock     = products.filter(p=>p.stock<=p.reorder);

  const prodQty = {};
  orderItems.forEach(i=>{prodQty[i.product_id]=(prodQty[i.product_id]||0)+i.qty;});
  const top5products = Object.entries(prodQty).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,qty])=>{
    const p=products.find(x=>x.id===id);
    return {name:p?p.name:id,qty};
  });
  const maxPQ = top5products[0]?.qty||1;

  const custSales = {};
  orders.forEach(o=>{custSales[o.customer_name]=(custSales[o.customer_name]||0)+(o.net||0);});
  const top5cust = Object.entries(custSales).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxCS = top5cust[0]?.[1]||1;

  const days = Array.from({length:7},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(6-i));
    const ds=d.toISOString().slice(0,10);
    return {ds,total:orders.filter(o=>o.date===ds).reduce((s,o)=>s+(o.paid||0),0)};
  });
  const maxDay = Math.max(...days.map(d=>d.total),1);

  const statusCounts = {"مكتمل":0,"جزئى":0,"لم يدفع":0};
  orders.forEach(o=>{
    if(o.status?.includes("مكتمل")) statusCounts["مكتمل"]++;
    else if(o.status?.includes("جزئياً")) statusCounts["جزئى"]++;
    else statusCounts["لم يدفع"]++;
  });

  return (
    <div>
      {lowStock.length>0&&<div className="alert alert-warn">⚠️ تنبيه: {lowStock.length} منتج وصل للحد الأدنى — {lowStock.slice(0,3).map(p=>p.name).join("، ")}</div>}
      <div className="stat-grid">
        {[
          {icon:"🛒",label:"إجمالى المبيعات",value:fmtNum(totalSales),sub:`ج.م — ${orders.length} أوردر`,color:"var(--gold)",cls:"text-gold"},
          {icon:"💰",label:"إجمالى الأرباح",value:fmtNum(grossProfit),sub:`ج.م — هامش ${totalSales>0?((grossProfit/totalSales)*100).toFixed(1):0}%`,color:"var(--green)",cls:"text-green"},
          {icon:"💸",label:"إجمالى المصروفات",value:fmtNum(totalExp),sub:`ج.م — ${expenses.length} بند`,color:"var(--red)",cls:"text-red"},
          {icon:"🏦",label:"رصيد الخزنة",value:fmtNum(safeBalance),sub:"ج.م — كاش متاح",color:"var(--blue)"},
          {icon:"📦",label:"قيمة المخزون",value:fmtNum(inventoryVal),sub:`ج.م — ${products.length} صنف`,color:"var(--purple)"},
          {icon:"📊",label:"صافى الربح",value:fmtNum(grossProfit-totalExp),sub:"ج.م — بعد المصروفات",color:"var(--orange)"},
        ].map((c,i)=>(
          <div key={i} className="stat-card" style={{"--accent-color":c.color}}>
            <div className="icon">{c.icon}</div>
            <div className="label">{c.label}</div>
            <div className={`value ${c.cls||""}`} style={c.cls?{}:{color:c.color}}>{c.value}</div>
            <div className="sub">{c.sub}</div>
          </div>
        ))}
      </div>
      <div className="dash-grid">
        <div className="dash-card">
          <div className="dash-card-header">📈 مبيعات آخر 7 أيام</div>
          <div className="dash-card-body">
            <div style={{display:"flex",alignItems:"flex-end",gap:6,height:80,marginBottom:8}}>
              {days.map((d,i)=>(
                <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                  <div style={{width:"100%",height:`${Math.max((d.total/maxDay)*70,2)}px`,background:"linear-gradient(to top,var(--gold3),var(--gold2))",borderRadius:"3px 3px 0 0",transition:"height .5s"}}/>
                  <span style={{fontSize:9,color:"var(--text3)"}}>{d.ds.slice(5)}</span>
                </div>
              ))}
            </div>
            <div style={{fontSize:12,color:"var(--text2)",textAlign:"center"}}>إجمالى: {fmt(days.reduce((s,d)=>s+d.total,0))}</div>
          </div>
        </div>
        <div className="dash-card">
          <div className="dash-card-header">📦 حالات الأوردرات</div>
          <div className="dash-card-body">
            {[["مكتمل","var(--green)"],["جزئى","var(--orange)"],["لم يدفع","var(--red)"]].map(([k,c])=>(
              <div key={k} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div style={{width:10,height:10,borderRadius:"50%",background:c,flexShrink:0}}/>
                <div style={{flex:1,fontSize:13}}>{k}</div>
                <div style={{fontWeight:700,color:c,fontSize:15}}>{statusCounts[k]}</div>
                <div style={{width:80,background:"var(--bg3)",borderRadius:4,height:8}}>
                  <div style={{width:`${orders.length?(statusCounts[k]/orders.length*100):0}%`,height:"100%",background:c,borderRadius:4}}/>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="dash-card">
          <div className="dash-card-header">🏆 أفضل 5 منتجات</div>
          <div className="dash-card-body">
            <div className="chart-bar">
              {top5products.map((p,i)=>(
                <div key={i} className="chart-bar-item">
                  <div className="bar-label">{p.name.slice(0,16)}</div>
                  <div className="bar-track"><div className="bar-fill" style={{width:`${(p.qty/maxPQ)*100}%`}}/></div>
                  <div className="bar-val">{p.qty} قطعة</div>
                </div>
              ))}
            </div>
          </div>
        </div>
        <div className="dash-card">
          <div className="dash-card-header">👑 أفضل 5 عملاء</div>
          <div className="dash-card-body">
            <div className="chart-bar">
              {top5cust.map(([name,amt],i)=>(
                <div key={i} className="chart-bar-item">
                  <div className="bar-label">{name}</div>
                  <div className="bar-track"><div className="bar-fill" style={{width:`${(amt/maxCS)*100}%`,background:"linear-gradient(90deg,#5a3f9a,#9060e0)"}}/></div>
                  <div className="bar-val">{fmtNum(amt)} ج</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── POS ──────────────────────────────────────────────────────────────────────
function POS({ products, productsTbl, customers, ordersTbl, safeLogTbl }) {
  const [cart, setCart]               = useState([]);
  const [selCustomer, setSelCustomer] = useState(null);
  const [custSearch, setCustSearch]   = useState("");
  const [prodSearch, setProdSearch]   = useState("");
  const [channel, setChannel]         = useState("واتساب");
  const [shippingFee, setShippingFee] = useState(0);
  const [discountType, setDiscountType] = useState("none");
  const [discountVal, setDiscountVal] = useState(0);
  const [paidAmt, setPaidAmt]         = useState(0);
  const [saving, setSaving]           = useState(false);
  const [success, setSuccess]         = useState(null);
  const [showInvoice, setShowInvoice] = useState(null);

  const filteredProds = products.filter(p=>(p.name+p.color+p.size+p.id_display).includes(prodSearch));
  const filteredCust  = custSearch ? customers.filter(c=>(c.name+c.phone).includes(custSearch)) : [];

  const subtotal    = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const discountAmt = discountType==="percent" ? subtotal*discountVal/100 : discountType==="value" ? Number(discountVal) : 0;
  const net         = subtotal + Number(shippingFee) - discountAmt;
  const remaining   = net - Number(paidAmt);

  const addToCart = (p) => {
    if(p.stock<1) return;
    setCart(prev=>{
      const ex=prev.find(i=>i.id===p.id);
      if(ex){ if(ex.qty>=p.stock) return prev; return prev.map(i=>i.id===p.id?{...i,qty:i.qty+1}:i); }
      return [...prev,{...p,qty:1}];
    });
  };

  const submitOrder = async () => {
    if(!selCustomer||cart.length===0||saving) return;
    setSaving(true);
    const paid = Number(paidAmt);
    const rem  = net - paid;
    const orderId = uid();
    const orderSeq = "ORD-" + Date.now().toString().slice(-6);

    const order = {
      id: orderId,
      id_display: orderSeq,
      date: today(),
      customer_id: selCustomer.id,
      customer_name: selCustomer.name,
      channel,
      subtotal,
      shipping: Number(shippingFee),
      discount: discountAmt,
      net, paid, remaining: rem,
      status: calcStatus(paid, net),
    };

    const items = cart.map(item=>({
      id: uid(),
      order_id: orderId,
      product_id: item.id,
      name: item.name, color: item.color,
      size: item.size, qty: item.qty,
      price: item.price, cost: item.cost,
    }));

    // Insert order
    const ok1 = await ordersTbl.insert(order);
    if(!ok1){ setSaving(false); return; }

    // Insert items
    const { error: e2 } = await sb.from("order_items").insert(items);
    if(e2){ setSaving(false); alert("خطأ في بنود الأوردر: " + e2.message); return; }

    // Update stock
    for(const item of cart){
      await sb.from("products").update({stock: (products.find(p=>p.id===item.id)?.stock||0) - item.qty}).eq("id", item.id);
    }
    await productsTbl.refresh();

    // Safe entry if paid
    if(paid>0){
      await safeLogTbl.insert({id:uid(),date:today(),type:"إيداع",amount:paid,direction:"وارد",ref:orderSeq,officer:"POS"});
      // Payment record
      await sb.from("payments").insert({id:uid(),order_id:orderId,amount:paid,date:today(),method:"كاش",note:"دفعة عند الأوردر"});
    }

    setShowInvoice({order:{...order,id_display:orderSeq}, items});
    setCart([]); setSelCustomer(null); setCustSearch(""); setProdSearch("");
    setShippingFee(0); setDiscountType("none"); setDiscountVal(0); setPaidAmt(0);
    setSuccess("تم إنشاء الأوردر بنجاح! ✅");
    setTimeout(()=>setSuccess(null),4000);
    setSaving(false);
  };

  const canSubmit = selCustomer && cart.length>0 && !saving;

  return (
    <div>
      {success&&<div className="alert alert-success">{success}</div>}
      {showInvoice&&<InvoiceModal data={showInvoice} onClose={()=>setShowInvoice(null)} customers={customers}/>}
      <div className="pos-layout">
        <div className="pos-left">
          <div className="search-bar">
            <span>🔍</span>
            <input placeholder="ابحث بالاسم، الكود، اللون..." value={prodSearch} onChange={e=>setProdSearch(e.target.value)}/>
          </div>
          <div className="pos-products table-wrap">
            {filteredProds.length===0
              ? <div style={{padding:30,textAlign:"center",color:"var(--text3)"}}>لا يوجد منتجات — أضف من المخزون أولاً</div>
              : <div className="product-grid">
                  {filteredProds.map(p=>(
                    <div key={p.id} className="product-card" onClick={()=>addToCart(p)} style={{opacity:p.stock<1?0.4:1}}>
                      <div className="pname">{p.name}</div>
                      <div className="pdetail">{p.color} — {p.size}</div>
                      <div className="pprice">{fmt(p.price)}</div>
                      <div className="pstock" style={{color:p.stock<=p.reorder?"var(--red)":"var(--text3)"}}>
                        {p.stock<=p.reorder?`⚠️ متبقى: ${p.stock}`:`📦 ${p.stock}`}
                      </div>
                    </div>
                  ))}
                </div>
            }
          </div>
        </div>
        <div className="pos-right">
          <div className="table-wrap">
            <div className="table-header"><h3>👤 بيانات العميل</h3></div>
            <div style={{padding:12}}>
              <div className="search-bar" style={{marginBottom:6}}>
                <span>🔍</span>
                <input placeholder="ابحث باسم أو تليفون" value={custSearch} onChange={e=>{setCustSearch(e.target.value);setSelCustomer(null);}}/>
              </div>
              {custSearch&&filteredCust.length>0&&(
                <div style={{background:"var(--bg3)",borderRadius:6,border:"1px solid var(--border2)",overflow:"hidden",marginBottom:6}}>
                  {filteredCust.slice(0,5).map(c=>(
                    <div key={c.id} onClick={()=>{setSelCustomer(c);setCustSearch("");}} style={{padding:"8px 12px",cursor:"pointer",borderBottom:"1px solid var(--border)",fontSize:13}}>
                      {c.name} — {c.phone}
                    </div>
                  ))}
                </div>
              )}
              {!selCustomer&&<div style={{fontSize:12,color:"var(--text3)",textAlign:"center",padding:"6px 0"}}>ابحث واختر عميل لإتمام البيع</div>}
              {selCustomer&&<div className="alert alert-success" style={{margin:0}}>✅ {selCustomer.name} — نقاط: {selCustomer.points}</div>}
            </div>
          </div>
          <div className="table-wrap" style={{flex:1}}>
            <div className="table-header"><h3>🛒 السلة ({cart.length})</h3></div>
            {cart.length===0
              ? <div style={{padding:20,textAlign:"center",color:"var(--text3)",fontSize:13}}>اضغط على منتج لإضافته</div>
              : cart.map(item=>(
                  <div key={item.id} className="cart-item">
                    <div className="cart-item-info">
                      <div className="name">{item.name}</div>
                      <div className="detail">{item.color} {item.size} × {fmt(item.price)}</div>
                    </div>
                    <div className="qty-control">
                      <button className="qty-btn" onClick={()=>setCart(prev=>prev.map(i=>i.id===item.id?{...i,qty:Math.max(1,i.qty-1)}:i))}>−</button>
                      <span style={{fontSize:13,fontWeight:700,minWidth:22,textAlign:"center"}}>{item.qty}</span>
                      <button className="qty-btn" onClick={()=>setCart(prev=>prev.map(i=>i.id===item.id?{...i,qty:i.qty+1}:i))}>+</button>
                    </div>
                    <div style={{fontWeight:700,fontSize:13,minWidth:70,textAlign:"left"}}>{fmt(item.price*item.qty)}</div>
                    <button className="btn btn-sm btn-danger" style={{padding:"3px 6px"}} onClick={()=>setCart(prev=>prev.filter(i=>i.id!==item.id))}>✕</button>
                  </div>
                ))
            }
          </div>
          <div className="table-wrap">
            <div style={{padding:14}}>
              <div className="form-grid form-grid-2" style={{gap:8,marginBottom:10}}>
                <div className="form-group">
                  <label>القناة</label>
                  <select value={channel} onChange={e=>setChannel(e.target.value)}>

                  <label>رسوم الشحن</label>

                <div className="form-group">

                    <option value="percent">نسبة %</option>

                {discountType!=="none"&&(
                  <div className="form-group">

              <div className="divider"/>

              <div className="form-group" style={{marginTop:10}}>
                <label>المبلغ المدفوع الآن</label>
                <input type="number" value={paidAmt} onChange={e=>setPaidAmt(e.target.value)} min="0"/>
              </div>
              {Number(paidAmt)>0&&(
                <div className="summary-row" style={{marginTop:6}}>
                  <span>المتبقى</span>
                  <span className={remaining<=0?"text-green":"text-red"}>{fmt(Math.max(remaining,0))}</span>
                </div>
              )}
              <button className="btn btn-primary" style={{width:"100%",marginTop:12,padding:"12px",fontSize:15,opacity:canSubmit?1:0.5}} onClick={submitOrder} disabled={!canSubmit}>
                {saving?"⏳ جارى الحفظ...":"✅ تأكيد الأوردر"}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── ORDERS ───────────────────────────────────────────────────────────────────
function Orders({ orders, ordersTbl, customers }) {
  const [search, setSearch]           = useState("");
  const [filterStatus, setFilterStatus] = useState("");
  const [filterChannel, setFilterChannel] = useState("");
  const [selected, setSelected]       = useState(null);
  const [showPayModal, setShowPayModal] = useState(false);
  const [showInvoice, setShowInvoice] = useState(null);
  const [payForm, setPayForm]         = useState({amount:0, date:today(), method:"كاش", note:""});
  const [orderItemsMap, setOrderItemsMap] = useState({});
  const [paymentsMap, setPaymentsMap] = useState({});

  const filtered = orders.filter(o=>{
    const ms = !search || (o.id_display+o.customer_name+o.channel).includes(search);
    const mst = !filterStatus || o.status?.includes(filterStatus);
    const mc  = !filterChannel || o.channel===filterChannel;
    return ms&&mst&&mc;
  });

  const loadOrderDetails = async (order) => {
    const { data: items } = await sb.from("order_items").select("*").eq("order_id", order.id);
    const { data: pays  } = await sb.from("payments").select("*").eq("order_id", order.id);
    setOrderItemsMap(m=>({...m,[order.id]:items||[]}));
    setPaymentsMap(m=>({...m,[order.id]:pays||[]}));
    setSelected(order);
  };

  const submitPayment = async () => {
    if(!selected||!payForm.amount) return;
    const amt = Number(payForm.amount);
    const allPaid = (paymentsMap[selected.id]||[]).reduce((s,p)=>s+p.amount,0) + amt;
    const newRemaining = Math.max(selected.net - allPaid, 0);
    const newStatus = calcStatus(allPaid, selected.net);

    await sb.from("payments").insert({id:uid(),order_id:selected.id,...payForm,amount:amt});
    await ordersTbl.update(selected.id, {paid:allPaid,remaining:newRemaining,status:newStatus});
    await sb.from("safe_log").insert({id:uid(),date:payForm.date,type:"تحصيل",amount:amt,direction:"وارد",ref:selected.id_display,officer:"النظام"});

    const updOrder = {...selected,paid:allPaid,remaining:newRemaining,status:newStatus};
    setSelected(updOrder);
    setPaymentsMap(m=>({...m,[selected.id]:[...(m[selected.id]||[]),{...payForm,amount:amt,id:uid()}]}));
    setShowPayModal(false);
    setPayForm({amount:0,date:today(),method:"كاش",note:""});
  };

  return (
    <div>
      {showInvoice&&<InvoiceModal data={showInvoice} onClose={()=>setShowInvoice(null)} customers={customers}/>}
      {selected&&(
        <div className="modal-overlay" onClick={()=>setSelected(null)}>
          <div className="modal" style={{maxWidth:700}} onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <h3>📋 {selected.id_display}</h3>
              <button className="btn btn-secondary btn-sm" onClick={()=>setSelected(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="form-grid form-grid-2" style={{marginBottom:12}}>
                {[["العميل",selected.customer_name],["التاريخ",selected.date],["القناة",selected.channel],["صافى",fmt(selected.net)],["المدفوع",fmt(selected.paid)],["المتبقى",fmt(selected.remaining)]].map(([l,v])=>(
                  <div key={l}><span className="text-muted">{l}: </span><strong>{v}</strong></div>
                ))}
              </div>
              <div style={{marginBottom:8,display:"flex",gap:8,flexWrap:"wrap"}}>
                {getStatusBadge(selected.status)}
                {selected.remaining>0&&<button className="btn btn-sm btn-success" onClick={()=>setShowPayModal(true)}>💵 تسجيل دفعة</button>}
                <button className="btn btn-sm btn-secondary" onClick={()=>setShowInvoice({order:selected,items:orderItemsMap[selected.id]||[]})}>🧾 الفاتورة</button>
              </div>
              {(paymentsMap[selected.id]||[]).length>0&&(
                <>
                  <h4 style={{marginBottom:8,marginTop:12}}>💰 سجل الدفعات</h4>
                  <table style={{width:"100%",fontSize:12}}>
                    <thead><tr><th>التاريخ</th><th>المبلغ</th><th>الطريقة</th><th>ملاحظة</th></tr></thead>
                    <tbody>
                      {(paymentsMap[selected.id]||[]).map((p,i)=>(
                        <tr key={i}>
                          <td>{p.date}</td>
                          <td className="text-green">{fmt(p.amount)}</td>
                          <td>{p.method}</td>
                          <td className="text-muted">{p.note}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </>
              )}
              <div className="divider"/>
              <h4 style={{marginBottom:8}}>بنود الأوردر</h4>
              <table style={{width:"100%",fontSize:12}}>
                <thead><tr><th>الصنف</th><th>اللون</th><th>المقاس</th><th>الكمية</th><th>السعر</th><th>الإجمالى</th><th>الربح</th></tr></thead>
                <tbody>
                  {(orderItemsMap[selected.id]||[]).map(i=>(
                    <tr key={i.id}>
                      <td>{i.name}</td><td>{i.color}</td><td>{i.size}</td><td>{i.qty}</td>
                      <td>{fmt(i.price)}</td><td>{fmt(i.price*i.qty)}</td>
                      <td className="text-green">{fmt((i.price-i.cost)*i.qty)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setSelected(null)}>إغلاق</button>
            </div>
          </div>
        </div>
      )}
      {showPayModal&&(
        <div className="modal-overlay" onClick={()=>setShowPayModal(false)}>
          <div className="modal" style={{maxWidth:420}} onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <h3>💵 تسجيل دفعة — {selected?.id_display}</h3>
              <button className="btn btn-secondary btn-sm" onClick={()=>setShowPayModal(false)}>✕</button>
            </div>
            <div className="modal-body">
              <div style={{background:"var(--bg3)",borderRadius:6,padding:"10px 14px",marginBottom:14,fontSize:13}}>
                <div>المتبقى على الأوردر: <strong className="text-red">{fmt(selected?.remaining)}</strong></div>
              </div>
              <div className="form-grid">
                <div className="form-group"><label>المبلغ المستلم</label>
                  <input type="number" value={payForm.amount} onChange={e=>setPayForm({...payForm,amount:e.target.value})} min="0"/>
                </div>
                <div className="form-group"><label>التاريخ</label>
                  <input type="date" value={payForm.date} onChange={e=>setPayForm({...payForm,date:e.target.value})}/>
                </div>
                <div className="form-group"><label>طريقة الدفع</label>
                  <select value={payForm.method} onChange={e=>setPayForm({...payForm,method:e.target.value})}>
                    {METHODS.map(m=><option key={m}>{m}</option>)}
                  </select>
                </div>
                <div className="form-group"><label>ملاحظة</label>
                  <input value={payForm.note} onChange={e=>setPayForm({...payForm,note:e.target.value})} placeholder="اختيارى"/>
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-primary" onClick={submitPayment}>✅ تأكيد الدفعة</button>
              <button className="btn btn-secondary" onClick={()=>setShowPayModal(false)}>إلغاء</button>
            </div>
          </div>
        </div>
      )}
      <div className="table-wrap">
        <div className="table-header">
          <h3>📋 الأوردرات ({filtered.length})</h3>
          <div className="flex gap-8 items-center" style={{flexWrap:"wrap"}}>
            <div className="search-bar"><span>🔍</span><input placeholder="بحث..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:130}}/></div>
            <select style={{background:"var(--bg3)",border:"1px solid var(--border2)",borderRadius:6,padding:"6px 10px",color:"var(--text)",fontSize:12}} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
              <option value="">كل الحالات</option>
              <option value="مكتمل">مكتمل</option>
              <option value="جزئياً">جزئى</option>
              <option value="لم يدفع">لم يدفع</option>
            </select>
            <select style={{background:"var(--bg3)",border:"1px solid var(--border2)",borderRadius:6,padding:"6px 10px",color:"var(--text)",fontSize:12}} value={filterChannel} onChange={e=>setFilterChannel(e.target.value)}>
              <option value="">كل القنوات</option>
              {CHANNELS.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
        </div>
        <div style={{overflowX:"auto"}}>
          <table>
            <thead><tr><th>الأوردر</th><th>التاريخ</th><th>العميل</th><th>القناة</th><th>صافى</th><th>المدفوع</th><th>المتبقى</th><th>الحالة</th><th></th></tr></thead>
            <tbody>
              {filtered.map(o=>(
                <tr key={o.id}>
                  <td className="text-gold">{o.id_display}</td>
                  <td className="text-muted">{o.date}</td>
                  <td>{o.customer_name}</td>
                  <td><span className="badge-blue">{o.channel}</span></td>
                  <td className="text-gold">{fmt(o.net)}</td>
                  <td className="text-green">{fmt(o.paid)}</td>
                  <td className={o.remaining>0?"text-red":"text-muted"}>{fmt(o.remaining)}</td>
                  <td>{getStatusBadge(o.status)}</td>
                  <td><button className="btn btn-sm btn-secondary" onClick={()=>loadOrderDetails(o)}>عرض</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── INVENTORY ────────────────────────────────────────────────────────────────
function Inventory({ products, productsTbl }) {
  const [search, setSearch]       = useState("");
  const [filterCat, setFilterCat] = useState("");
  const [showModal, setShowModal] = useState(false);
  const [editItem, setEditItem]   = useState(null);
  const emptyForm = {id_display:"",name:"",category:"",color:"",size:"",cost:0,price:0,stock:0,reorder:5};
  const [form, setForm] = useState(emptyForm);

  const cats     = [...new Set(products.map(p=>p.category).filter(Boolean))];
  const filtered = products.filter(p=>{
    const ms = !search||(p.id_display+p.name+p.color+p.size+p.category).includes(search);
    const mc = !filterCat||p.category===filterCat;
    return ms&&mc;
  });

  const openAdd  = () => { setEditItem(null); setForm({...emptyForm,id_display:"P-"+Date.now().toString().slice(-5)}); setShowModal(true); };
  const openEdit = (p) => { setEditItem(p); setForm({...p}); setShowModal(true); };

  const save = async () => {
    if(!form.name) return;
    if(editItem){
      await productsTbl.update(editItem.id, {...form,cost:Number(form.cost),price:Number(form.price),stock:Number(form.stock),reorder:Number(form.reorder)});
    } else {
      await productsTbl.insert({id:uid(),...form,cost:Number(form.cost),price:Number(form.price),stock:Number(form.stock),reorder:Number(form.reorder)});
    }
    setShowModal(false);
  };

  const del = async (id) => {
    if(window.confirm("حذف هذا الصنف؟")) await productsTbl.remove(id);
  };

  return (
    <div>
      {showModal&&(
        <div className="modal-overlay" onClick={()=>setShowModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <h3>{editItem?"تعديل صنف":"إضافة صنف جديد"}</h3>
              <button className="btn btn-secondary btn-sm" onClick={()=>setShowModal(false)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="form-grid form-grid-2">
                {[["id_display","كود الصنف"],["name","اسم الصنف"],["category","الفئة"],["color","اللون"],["size","المقاس"]].map(([k,l])=>(
                  <div key={k} className="form-group"><label>{l}</label><input value={form[k]||""} onChange={e=>setForm({...form,[k]:e.target.value})}/></div>
                ))}
                {[["cost","سعر الشراء"],["price","سعر البيع"],["stock","الكمية المتاحة"],["reorder","حد إعادة الطلب"]].map(([k,l])=>(
                  <div key={k} className="form-group"><label>{l}</label><input type="number" value={form[k]} onChange={e=>setForm({...form,[k]:Number(e.target.value)})}/></div>
                ))}
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-primary" onClick={save}>💾 حفظ</button>
              <button className="btn btn-secondary" onClick={()=>setShowModal(false)}>إلغاء</button>
            </div>
          </div>
        </div>
      )}
      <div className="table-wrap">
        <div className="table-header">
          <h3>📦 المخزون ({filtered.length} صنف)</h3>
          <div className="flex gap-8 items-center" style={{flexWrap:"wrap"}}>
            <div className="search-bar"><span>🔍</span><input placeholder="بحث..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:130}}/></div>
            <select style={{background:"var(--bg3)",border:"1px solid var(--border2)",borderRadius:6,padding:"6px 10px",color:"var(--text)",fontSize:12}} value={filterCat} onChange={e=>setFilterCat(e.target.value)}>
              <option value="">كل الفئات</option>
              {cats.map(c=><option key={c}>{c}</option>)}
            </select>
            <button className="btn btn-primary btn-sm" onClick={openAdd}>+ إضافة صنف</button>
          </div>
        </div>
        <div style={{overflowX:"auto"}}>
          <table>
            <thead><tr><th>الكود</th><th>الاسم</th><th>الفئة</th><th>اللون</th><th>المقاس</th><th>الشراء</th><th>البيع</th><th>الهامش</th><th>المخزون</th><th>الحالة</th><th></th></tr></thead>
            <tbody>
              {filtered.map(p=>(
                <tr key={p.id}>
                  <td className="text-gold">{p.id_display}</td><td>{p.name}</td>
                  <td><span className="badge-blue">{p.category}</span></td>
                  <td>{p.color}</td><td>{p.size}</td>
                  <td>{fmt(p.cost)}</td><td className="text-gold">{fmt(p.price)}</td>
                  <td className="text-green">{p.price>0?(((p.price-p.cost)/p.price)*100).toFixed(1):0}%</td>
                  <td style={{fontWeight:700,color:p.stock<=p.reorder?"var(--red)":"var(--green)"}}>{p.stock}</td>
                  <td>{p.stock<=p.reorder?<span className="badge-red">⚠️ منخفض</span>:<span className="badge-green">✓ جيد</span>}</td>
                  <td>
                    <div className="flex gap-8">
                      <button className="btn btn-sm btn-secondary" onClick={()=>openEdit(p)}>✏️</button>
                      <button className="btn btn-sm btn-danger" onClick={()=>del(p.id)}>🗑</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── CUSTOMERS ────────────────────────────────────────────────────────────────
function Customers({ customers, customersTbl, orders }) {
  const [search, setSearch]       = useState("");
  const [showModal, setShowModal] = useState(false);
  const [editItem, setEditItem]   = useState(null);
  const [form, setForm]           = useState({id_display:"",name:"",phone:"",email:"",address:"",points:0});
  const [statement, setStatement] = useState(null);

  const filtered = customers.filter(c=>!search||(c.id_display+c.name+c.phone+c.address).includes(search));
  const openAdd  = () => { setEditItem(null); setForm({id_display:"C-"+Date.now().toString().slice(-5),name:"",phone:"",email:"",address:"",points:0}); setShowModal(true); };
  const openEdit = (c) => { setEditItem(c); setForm({...c}); setShowModal(true); };
  const save = async () => {
    if(!form.name) return;
    if(editItem) await customersTbl.update(editItem.id, form);
    else await customersTbl.insert({id:uid(),...form,points:Number(form.points)});
    setShowModal(false);
  };
  const del = async (id) => { if(window.confirm("حذف هذا العميل؟")) await customersTbl.remove(id); };
  const custOrders = (cid) => orders.filter(o=>o.customer_id===cid);
  const custTotal  = (cid) => custOrders(cid).reduce((s,o)=>s+(o.net||0),0);
  const custRemain = (cid) => custOrders(cid).reduce((s,o)=>s+(o.remaining||0),0);

  return (
    <div>

                  <div className="value" style={{fontSize:18}}>{fmt(custTotal(statement.customer.id))}</div>

                  <div className="label">المتبقى</div>
                  <div className="value text-red" style={{fontSize:18}}>{fmt(custRemain(statement.customer.id))}</div>

              <table style={{width:"100%",fontSize:12}}>
                <thead><tr><th>الأوردر</th><th>التاريخ</th><th>صافى</th><th>مدفوع</th><th>متبقى</th><th>الحالة</th></tr></thead>
                <tbody>
                  {statement.orders.map(o=>(
                    <tr key={o.id}>
                      <td className="text-gold">{o.id_display}</td><td>{o.date}</td>

            <div className="modal-footer"><button className="btn btn-secondary" onClick={()=>setStatement(null)}>إغلاق</button></div>
          </div>
        </div>
      )}
      {showModal&&(
        <div className="modal-overlay" onClick={()=>setShowModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>

              <h3>{editItem?"تعديل عميل":"إضافة عميل جديد"}</h3>
              <button className="btn btn-secondary btn-sm" onClick={()=>setShowModal(false)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="form-grid form-grid-2">
                {[["id_display","كود العميل"],["name","الاسم"],["phone","التليفون"],["email","الإيميل"],["address","العنوان"]].map(([k,l])=>(
                  <div key={k} className="form-group"><label>{l}</label><input value={form[k]||""} onChange={e=>setForm({...form,[k]:e.target.value})}/></div>
                ))}
                <div className="form-group"><label>نقاط الولاء</label><input type="number" value={form.points||0} onChange={e=>setForm({...form,points:Number(e.target.value)})}/></div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-primary" onClick={save}>💾 حفظ</button>
              <button className="btn btn-secondary" onClick={()=>setShowModal(false)}>إلغاء</button>
            </div>
          </div>
        </div>
      )}

          <h3>👥 العملاء ({filtered.length})</h3>

              {filtered.map(c=>(
                <tr key={c.id}>
                  <td className="text-gold">{c.id_display}</td><td>{c.name}</td><td>{c.phone}</td>
                  <td className="text-muted">{c.email||"—"}</td>
                  <td className="text-muted">{c.address}</td>
                  <td className="text-green">{fmt(custTotal(c.id))}</td>
                  <td className={custRemain(c.id)>0?"text-red":"text-muted"}>{fmt(custRemain(c.id))}</td>

                  <td>
                    <div className="flex gap-8">
                      <button className="btn btn-sm btn-success" onClick={()=>setStatement({customer:c,orders:custOrders(c.id)})}>📋</button>
                      <button className="btn btn-sm btn-secondary" onClick={()=>openEdit(c)}>✏️</button>
                      <button className="btn btn-sm btn-danger" onClick={()=>del(c.id)}>🗑</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>

// ─── PURCHASES ────────────────────────────────────────────────────────────────
function Purchases({ purchases, purchasesTbl, suppliers, products, productsTbl, safeLogTbl }) {
  const [showModal, setShowModal]       = useState(false);
  const [editItem, setEditItem]         = useState(null);
  const [showPayModal, setShowPayModal] = useState(false);
  const [selPur, setSelPur]             = useState(null);
  const [payForm, setPayForm]           = useState({amount:0, date:today(), method:"كاش"});
  const [form, setForm]                 = useState({id_display:"",supplier_id:"",date:today(),product_id:"",product_name:"",total:0,qty:0,paid:0});

  const openAdd  = () => { setEditItem(null); setForm({id_display:"PUR-"+Date.now().toString().slice(-5),supplier_id:"",date:today(),product_id:"",product_name:"",total:0,qty:0,paid:0}); setShowModal(true); };
  const openEdit = (p) => { setEditItem(p); setForm({...p}); setShowModal(true); };

  const save = async () => {
    if(!form.supplier_id||!form.product_id) return;
    const remaining = Number(form.total)-Number(form.paid);
    const status    = remaining<=0?"مدفوع بالكامل ✅":Number(form.paid)>0?"مدفوع جزئياً 🔶":"غير مدفوع ❌";
    const row       = {...form,total:Number(form.total),qty:Number(form.qty),paid:Number(form.paid),remaining,status};
    if(editItem){
      await purchasesTbl.update(editItem.id, row);
    } else {
      await purchasesTbl.insert({id:uid(),...row});
      const prod = products.find(p=>p.id===form.product_id);
      if(prod) await productsTbl.update(prod.id, {stock:(prod.stock||0)+Number(form.qty)});
      if(Number(form.paid)>0) await safeLogTbl.insert({id:uid(),date:today(),type:"مشتريات",amount:Number(form.paid),direction:"صادر",ref:form.id_display,officer:"النظام"});
    }
    setShowModal(false);
  };

  const submitPayment = async () => {
    if(!selPur||!payForm.amount) return;
    const amt = Number(payForm.amount);
    const newPaid = (selPur.paid||0) + amt;
    const newRem  = Math.max((selPur.total||0) - newPaid, 0);
    const status  = newRem<=0?"مدفوع بالكامل ✅":"مدفوع جزئياً 🔶";
    await purchasesTbl.update(selPur.id, {paid:newPaid,remaining:newRem,status});
    await safeLogTbl.insert({id:uid(),date:payForm.date,type:"مشتريات",amount:amt,direction:"صادر",ref:selPur.id_display,officer:"النظام"});
    setShowPayModal(false);
  };

  const del = async (id) => { if(window.confirm("حذف هذا الأمر؟")) await purchasesTbl.remove(id); };

  return (
    <div>
      {showModal&&(
        <div className="modal-overlay" onClick={()=>setShowModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><h3>{editItem?"تعديل أمر شراء":"إضافة أمر شراء"}</h3><button className="btn btn-secondary btn-sm" onClick={()=>setShowModal(false)}>✕</button></div>
            <div className="modal-body">
              <div className="form-grid form-grid-2">
                <div className="form-group"><label>المورد</label>
                  <select value={form.supplier_id} onChange={e=>setForm({...form,supplier_id:e.target.value})}>
                    <option value="">اختر مورد</option>
                    {suppliers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                </div>
                <div className="form-group"><label>التاريخ</label><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
                <div className="form-group"><label>الصنف</label>
                  <select value={form.product_id} onChange={e=>{const p=products.find(x=>x.id===e.target.value);setForm({...form,product_id:e.target.value,product_name:p?p.name:""});}}>
                    <option value="">اختر صنف</option>
                    {products.map(p=><option key={p.id} value={p.id}>{p.id_display} — {p.name}</option>)}
                  </select>
                </div>
                <div className="form-group"><label>الكمية</label><input type="number" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})}/></div>
                <div className="form-group"><label>الإجمالى</label><input type="number" value={form.total} onChange={e=>setForm({...form,total:e.target.value})}/></div>
                <div className="form-group"><label>المدفوع</label><input type="number" value={form.paid} onChange={e=>setForm({...form,paid:e.target.value})}/></div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-primary" onClick={save}>💾 حفظ</button>
              <button className="btn btn-secondary" onClick={()=>setShowModal(false)}>إلغاء</button>
            </div>
          </div>
        </div>
      )}
      {showPayModal&&(
        <div className="modal-overlay" onClick={()=>setShowPayModal(false)}>
          <div className="modal" style={{maxWidth:400}} onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><h3>💵 دفعة للمورد — {selPur?.id_display}</h3><button className="btn btn-secondary btn-sm" onClick={()=>setShowPayModal(false)}>✕</button></div>
            <div className="modal-body">
              <div style={{background:"var(--bg3)",borderRadius:6,padding:"8px 12px",marginBottom:12,fontSize:13}}>
                المتبقى: <strong className="text-red">{fmt(selPur?.remaining)}</strong>
              </div>
              <div className="form-grid">
                <div className="form-group"><label>المبلغ</label><input type="number" value={payForm.amount} onChange={e=>setPayForm({...payForm,amount:e.target.value})} min="0"/></div>
                <div className="form-group"><label>التاريخ</label><input type="date" value={payForm.date} onChange={e=>setPayForm({...payForm,date:e.target.value})}/></div>
                <div className="form-group"><label>طريقة الدفع</label>
                  <select value={payForm.method} onChange={e=>setPayForm({...payForm,method:e.target.value})}>
                    {METHODS.map(m=><option key={m}>{m}</option>)}
                  </select>
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-primary" onClick={submitPayment}>✅ تأكيد</button>
              <button className="btn btn-secondary" onClick={()=>setShowPayModal(false)}>إلغاء</button>
            </div>
          </div>
        </div>
      )}
      <div className="table-wrap">
        <div className="table-header">
          <h3>🛍️ المشتريات ({purchases.length})</h3>
          <button className="btn btn-primary btn-sm" onClick={openAdd}>+ أمر شراء جديد</button>
        </div>
        <div style={{overflowX:"auto"}}>
          <table>
            <thead><tr><th>الكود</th><th>المورد</th><th>التاريخ</th><th>الصنف</th><th>الكمية</th><th>الإجمالى</th><th>المدفوع</th><th>المتبقى</th><th>الحالة</th><th></th></tr></thead>
            <tbody>
              {purchases.map(p=>(
                <tr key={p.id}>
                  <td className="text-gold">{p.id_display}</td>
                  <td>{suppliers.find(s=>s.id===p.supplier_id)?.name||p.supplier_id}</td>
                  <td className="text-muted">{p.date?.slice(0,10)}</td>
                  <td>{p.product_name}</td><td>{p.qty}</td>
                  <td>{fmt(p.total)}</td><td className="text-green">{fmt(p.paid)}</td>
                  <td className={p.remaining>0?"text-red":"text-muted"}>{fmt(p.remaining||0)}</td>
                  <td>{getStatusBadge(p.status)}</td>
                  <td>
                    <div className="flex gap-8">
                      {p.remaining>0&&<button className="btn btn-sm btn-success" onClick={()=>{setSelPur(p);setShowPayModal(true);}}>💵</button>}
                      <button className="btn btn-sm btn-secondary" onClick={()=>openEdit(p)}>✏️</button>
                      <button className="btn btn-sm btn-danger" onClick={()=>del(p.id)}>🗑</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

            <div className="modal-header"><h3>{editItem?"تعديل شحنة":"إضافة شحنة"}</h3><button className="btn btn-secondary btn-sm" onClick={()=>setShowModal(false)}>✕</button></div>
            <div className="modal-body">
              <div className="form-grid form-grid-2">
                <div className="form-group"><label>الأوردر</label>
                  <select value={form.order_id} onChange={e=>{const o=orders.find(x=>x.id===e.target.value);setForm({...form,order_id:e.target.value,customer_name:o?.customer_name||""});}}>
                    <option value="">اختر أوردر</option>
                    {orders.map(o=><option key={o.id} value={o.id}>{o.id_display} — {o.customer_name}</option>)}
                  </select>
                </div>
                <div className="form-group"><label>شركة الشحن</label>
                  <select value={form.courier} onChange={e=>setForm({...form,courier:e.target.value})}>
                    {COURIERS.map(c=><option key={c}>{c}</option>)}
                  </select>
                </div>
                <div className="form-group"><label>رقم التتبع</label><input value={form.tracking} onChange={e=>setForm({...form,tracking:e.target.value})}/></div>
                <div className="form-group"><label>تكلفة الشحن</label><input type="number" value={form.cost} onChange={e=>setForm({...form,cost:Number(e.target.value)})}/></div>
                <div className="form-group"><label>التاريخ المتوقع</label><input type="date" value={form.expected_date} onChange={e=>setForm({...form,expected_date:e.target.value})}/></div>
                <div className="form-group"><label>الحالة</label>
                  <select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
                    {["معلق ⏳","جارى التوصيل 🚚","تم التسليم ✅","مرتجع ❌"].map(s=><option key={s}>{s}</option>)}
                  </select>
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-primary" onClick={save}>💾 حفظ</button>
              <button className="btn btn-secondary" onClick={()=>setShowModal(false)}>إلغاء</button>
            </div>
          </div>
        </div>
      )}
      <div className="table-wrap">
        <div className="table-header"><h3>🚚 الشحن والتوصيل ({shipping.length})</h3><button className="btn btn-primary btn-sm" onClick={openAdd}>+ شحنة جديدة</button></div>
        <div style={{overflowX:"auto"}}>
          <table>
            <thead><tr><th>الأوردر</th><th>العميل</th><th>شركة الشحن</th><th>رقم التتبع</th><th>التكلفة</th><th>التسليم المتوقع</th><th>الحالة</th><th></th></tr></thead>
            <tbody>
              {shipping.map(s=>(
                <tr key={s.id}>
                  <td className="text-gold">{orders.find(o=>o.id===s.order_id)?.id_display||s.order_id}</td>
                  <td>{s.customer_name}</td>
                  <td><span className="badge-blue">{s.courier}</span></td>
                  <td className="text-muted">{s.tracking}</td>
                  <td>{fmt(s.cost)}</td><td className="text-muted">{s.expected_date}</td>
                  <td>{getStatusBadge(s.status)}</td>
                  <td>
                    <div className="flex gap-8">
                      <button className="btn btn-sm btn-secondary" onClick={()=>openEdit(s)}>✏️</button>
                      <button className="btn btn-sm btn-danger" onClick={()=>del(s.id)}>🗑</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── RETURNS ──────────────────────────────────────────────────────────────────
function Returns({ returns, returnsTbl, orders, products, productsTbl, safeLogTbl }) {
  const [showModal, setShowModal] = useState(false);
  const [form, setForm] = useState({order_id:"",date:today(),customer_name:"",product_id:"",product_name:"",qty:1,value:0,reason:"مقاس غلط",action:"استرداد"});
  const total = returns.reduce((s,r)=>s+(r.value||0),0);

  const save = async () => {
    if(!form.order_id||!form.product_id) return;
    const id = uid();
    const idDisp = "RET-"+Date.now().toString().slice(-5);
    await returnsTbl.insert({id,id_display:idDisp,...form,qty:Number(form.qty),value:Number(form.value)});
    const prod = products.find(p=>p.id===form.product_id);
    if(prod) await productsTbl.update(prod.id, {stock:(prod.stock||0)+Number(form.qty)});
    if(form.action==="استرداد"&&Number(form.value)>0){
      await safeLogTbl.insert({id:uid(),date:today(),type:"مرتجع",amount:Number(form.value),direction:"صادر",ref:idDisp,officer:"النظام"});
    }
    setShowModal(false);
  };
  const del = async (id) => { if(window.confirm("حذف هذا المرتجع؟")) await returnsTbl.remove(id); };

  return (
    <div>
      {showModal&&(
        <div className="modal-overlay" onClick={()=>setShowModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><h3>تسجيل مرتجع</h3><button className="btn btn-secondary btn-sm" onClick={()=>setShowModal(false)}>✕</button></div>
            <div className="modal-body">
              <div className="form-grid form-grid-2">
                <div className="form-group"><label>الأوردر</label>
                  <select value={form.order_id} onChange={e=>{const o=orders.find(x=>x.id===e.target.value);setForm({...form,order_id:e.target.value,customer_name:o?.customer_name||""});}}>
                    <option value="">اختر أوردر</option>
                    {orders.map(o=><option key={o.id} value={o.id}>{o.id_display} — {o.customer_name}</option>)}
                  </select>
                </div>
                <div className="form-group"><label>الصنف</label>
                  <select value={form.product_id} onChange={e=>{const p=products.find(x=>x.id===e.target.value);setForm({...form,product_id:e.target.value,product_name:p?.name||"",value:p?.price||0});}}>
                    <option value="">اختر صنف</option>
                    {products.map(p=><option key={p.id} value={p.id}>{p.id_display} — {p.name}</option>)}
                  </select>
                </div>
                <div className="form-group"><label>الكمية</label><input type="number" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})} min="1"/></div>
                <div className="form-group"><label>القيمة</label><input type="number" value={form.value} onChange={e=>setForm({...form,value:e.target.value})}/></div>
                <div className="form-group"><label>سبب الإرجاع</label>
                  <select value={form.reason} onChange={e=>setForm({...form,reason:e.target.value})}>
                    {["مقاس غلط","عيب مصنعى","مش عاجب","تالف","أخرى"].map(r=><option key={r}>{r}</option>)}
                  </select>
                </div>
                <div className="form-group"><label>الإجراء</label>
                  <select value={form.action} onChange={e=>setForm({...form,action:e.target.value})}>
                    {["استرداد","استبدال","كريدت"].map(a=><option key={a}>{a}</option>)}
                  </select>
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-primary" onClick={save}>💾 حفظ + رجع المخزون</button>
              <button className="btn btn-secondary" onClick={()=>setShowModal(false)}>إلغاء</button>
            </div>
          </div>
        </div>
      )}
      <div className="stat-grid" style={{marginBottom:20}}>
        <div className="stat-card" style={{"--accent-color":"var(--orange)"}}>
          <div className="label">إجمالى المرتجعات</div>
          <div className="value text-red">{returns.length} مرتجع</div>
          <div className="sub">قيمة: {fmt(total)}</div>
        </div>
      </div>
      <div className="table-wrap">
        <div className="table-header"><h3>↩️ المرتجعات ({returns.length})</h3><button className="btn btn-primary btn-sm" onClick={()=>setShowModal(true)}>+ مرتجع جديد</button></div>
        <div style={{overflowX:"auto"}}>
          <table>
            <thead><tr><th>الأوردر</th><th>التاريخ</th><th>العميل</th><th>الصنف</th><th>الكمية</th><th>القيمة</th><th>السبب</th><th>الإجراء</th><th></th></tr></thead>
            <tbody>
              {returns.map(r=>(
                <tr key={r.id}>
                  <td className="text-gold">{r.order_id}</td>
                  <td className="text-muted">{r.date}</td><td>{r.customer_name}</td><td>{r.product_name}</td>
                  <td>{r.qty}</td><td className="text-red">{fmt(r.value)}</td>
                  <td><span className="badge-orange">{r.reason}</span></td>
                  <td><span className="badge-blue">{r.action}</span></td>
                  <td><button className="btn btn-sm btn-danger" onClick={()=>del(r.id)}>🗑</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── SQL SCRIPT MODAL ─────────────────────────────────────────────────────────
function SqlModal({ onClose }) {
  const sql = `-- شغل ده في Supabase → SQL Editor مرة واحدة بس

create table if not exists products (
  id uuid primary key, id_display text, name text, category text,
  color text, size text, cost numeric default 0, price numeric default 0,
  stock int default 0, reorder int default 5, created_at timestamptz default now()
);
create table if not exists customers (
  id uuid primary key, id_display text, name text, phone text,
  email text, address text, points int default 0, created_at timestamptz default now()
);
create table if not exists orders (
  id uuid primary key, id_display text, date text, customer_id uuid, customer_name text,
  channel text, subtotal numeric, shipping numeric, discount numeric, net numeric,
  paid numeric, remaining numeric, status text, created_at timestamptz default now()
);
create table if not exists order_items (
  id uuid primary key, order_id uuid, product_id uuid, name text, color text,
  size text, qty int, price numeric, cost numeric, created_at timestamptz default now()
);
create table if not exists payments (
  id uuid primary key, order_id uuid, amount numeric, date text,
  method text, note text, created_at timestamptz default now()
);
create table if not exists suppliers (
  id uuid primary key, id_display text, name text, phone text, address text,
  total_purchases numeric default 0, total_paid numeric default 0,
  balance numeric default 0, created_at timestamptz default now()
);
create table if not exists purchases (
  id uuid primary key, id_display text, supplier_id uuid, date text,
  product_id uuid, product_name text, total numeric, qty int,
  paid numeric, remaining numeric, status text, created_at timestamptz default now()
);
create table if not exists expenses (
  id uuid primary key, id_display text, date text, category text,
  description text, amount numeric, method text, created_at timestamptz default now()
);
create table if not exists safe_log (
  id uuid primary key, date text, type text, amount numeric,
  direction text, ref text, officer text, created_at timestamptz default now()
);
create table if not exists shipping (
  id uuid primary key, id_display text, order_id uuid, date text, customer_name text,
  courier text, cost numeric, tracking text, status text,
  expected_date text, created_at timestamptz default now()
);
create table if not exists returns (
  id uuid primary key, id_display text, order_id text, date text,
  customer_name text, product_id uuid, product_name text,
  qty int, value numeric, reason text, action text, created_at timestamptz default now()
);

-- Enable realtime for all tables
alter publication supabase_realtime add table products;
alter publication supabase_realtime add table customers;
alter publication supabase_realtime add table orders;
alter publication supabase_realtime add table order_items;
alter publication supabase_realtime add table payments;
alter publication supabase_realtime add table suppliers;
alter publication supabase_realtime add table purchases;
alter publication supabase_realtime add table expenses;
alter publication supabase_realtime add table safe_log;
alter publication supabase_realtime add table shipping;
alter publication supabase_realtime add table returns;

-- Disable RLS for simplicity (enable & add policies for production)
alter table products disable row level security;
alter table customers disable row level security;
alter table orders disable row level security;
alter table order_items disable row level security;
alter table payments disable row level security;
alter table suppliers disable row level security;
alter table purchases disable row level security;
alter table expenses disable row level security;
alter table safe_log disable row level security;
alter table shipping disable row level security;
alter table returns disable row level security;`;

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:700}} onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <h3>🗄️ SQL Script — شغله في Supabase مرة واحدة</h3>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="alert alert-info" style={{marginBottom:12}}>
            روح <strong>Supabase → SQL Editor → New Query</strong> ← الصق الكود ← Run
          </div>
          <textarea readOnly value={sql} style={{width:"100%",height:320,background:"var(--bg3)",border:"1px solid var(--border2)",borderRadius:6,color:"var(--text2)",fontFamily:"monospace",fontSize:11,padding:12,direction:"ltr",resize:"vertical"}}/>
        </div>
        <div className="modal-footer">
          <button className="btn btn-primary" onClick={()=>{navigator.clipboard.writeText(sql);alert("تم النسخ ✅");}}>📋 نسخ الكود</button>
          <button className="btn btn-secondary" onClick={onClose}>إغلاق</button>
        </div>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser]     = useState(null);
  const [page, setPage]     = useState("dashboard");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [showSql, setShowSql] = useState(false);
  const [dbReady, setDbReady] = useState(false);

  // All tables via the hook
  const productsTbl   = useTable("products");
  const customersTbl  = useTable("customers");
  const ordersTbl     = useTable("orders");
  const suppliersTbl  = useTable("suppliers");
  const purchasesTbl  = useTable("purchases");
  const expensesTbl   = useTable("expenses");
  const safeLogTbl    = useTable("safe_log");
  const shippingTbl   = useTable("shipping");
  const returnsTbl    = useTable("returns");

  // order_items loaded on demand per order — global list for dashboard
  const [orderItems, setOrderItems] = useState([]);
  useEffect(()=>{
    sb.from("order_items").select("*").then(({data})=>setOrderItems(data||[]));
    const ch = sb.channel("rt-order_items")
      .on("postgres_changes",{event:"*",schema:"public",table:"order_items"},()=>{
        sb.from("order_items").select("*").then(({data})=>setOrderItems(data||[]));
      }).subscribe();
    return ()=>sb.removeChannel(ch);
  },[]);

  const allLoading = productsTbl.loading || customersTbl.loading || ordersTbl.loading;

  if(SUPABASE_URL.includes("YOUR_PROJECT")) return <><style>{css}</style><SetupScreen/></>;
  if(!user) return <><style>{css}</style><Login onLogin={u=>{setUser(u);setPage("dashboard");}}/></>;

  const role = ROLES[user.role];
  const canAccess = (id) => role.access.includes(id);

  const renderPage = () => {
    if(!canAccess(page)) return <div className="alert alert-danger">⛔ ليس لديك صلاحية لهذه الصفحة</div>;
    switch(page){
      case "dashboard":  return <Dashboard orders={ordersTbl.data} orderItems={orderItems} expenses={expensesTbl.data} products={productsTbl.data} safeLog={safeLogTbl.data}/>;
      case "pos":        return <POS products={productsTbl.data} productsTbl={productsTbl} customers={customersTbl.data} ordersTbl={ordersTbl} safeLogTbl={safeLogTbl}/>;
      case "orders":     return <Orders orders={ordersTbl.data} ordersTbl={ordersTbl} customers={customersTbl.data}/>;
      case "inventory":  return <Inventory products={productsTbl.data} productsTbl={productsTbl}/>;
      case "customers":  return <Customers customers={customersTbl.data} customersTbl={customersTbl} orders={ordersTbl.data}/>;
      case "suppliers":  return <Suppliers suppliers={suppliersTbl.data} suppliersTbl={suppliersTbl}/>;
      case "purchases":  return <Purchases purchases={purchasesTbl.data} purchasesTbl={purchasesTbl} suppliers={suppliersTbl.data} products={productsTbl.data} productsTbl={productsTbl} safeLogTbl={safeLogTbl}/>;
      case "expenses":   return <Expenses expenses={expensesTbl.data} expensesTbl={expensesTbl} safeLogTbl={safeLogTbl}/>;
      case "safe":       return <Safe safeLog={safeLogTbl.data} safeLogTbl={safeLogTbl}/>;
      case "shipping":   return <Shipping shipping={shippingTbl.data} shippingTbl={shippingTbl} orders={ordersTbl.data}/>;
      case "returns":    return <Returns returns={returnsTbl.data} returnsTbl={returnsTbl} orders={ordersTbl.data} products={productsTbl.data} productsTbl={productsTbl} safeLogTbl={safeLogTbl}/>;
      default:           return null;
    }
  };

  const navigate = (id) => { if(canAccess(id)){setPage(id);setSidebarOpen(false);} };
  const lowStockCount = productsTbl.data.filter(p=>p.stock<=p.reorder).length;

  return (
    <div>
      <style>{css}</style>
      {showSql&&<SqlModal onClose={()=>setShowSql(false)}/>}
      {allLoading&&(
        <div className="loading-overlay">
          <div className="spinner"/>
          <div style={{color:"var(--text2)",fontSize:13}}>جارى تحميل البيانات من Supabase...</div>
        </div>
      )}
      <div className="app">
        {/* Sidebar overlay for mobile */}
        <div className="sidebar-overlay" style={{display:sidebarOpen?"block":"none"}} onClick={()=>setSidebarOpen(false)}/>
        <div className={`sidebar${sidebarOpen?"":" collapsed"}`} style={{position:window.innerWidth<=768?"fixed":"relative",zIndex:50}}>
          <div className="sidebar-logo">
            <h1>⚡ A&M Store</h1>
            <p>نظام الإدارة المتكامل</p>
          </div>
          <div className="sidebar-role">
            مرحباً <span>{user.name}</span> — <span style={{color:role.color}}>{role.label}</span>
          </div>
          <nav className="sidebar-nav">
            {NAV.map((item,i)=>(
              item.section
                ? <div key={i} className="nav-section">{item.section}</div>
                : <div key={item.id} className={`nav-item${page===item.id?" active":""}`} onClick={()=>navigate(item.id)} style={{opacity:canAccess(item.id)?1:0.35}}>
                    <span className="nav-icon">{item.icon}</span>
                    {item.label}
                    {item.id==="inventory"&&lowStockCount>0&&<span className="badge">{lowStockCount}</span>}
                  </div>
            ))}
          </nav>
          <div style={{padding:"12px 16px",borderTop:"1px solid var(--border)"}}>
            <button className="btn btn-secondary btn-sm" style={{width:"100%",marginBottom:6}} onClick={()=>setShowSql(true)}>🗄️ SQL Script</button>
            <button className="btn btn-danger btn-sm" style={{width:"100%"}} onClick={()=>setUser(null)}>🚪 خروج</button>
          </div>
        </div>
        <div className="main">
          <div className="topbar">
            <div className="flex gap-8 items-center">
              <button className="hamburger" onClick={()=>setSidebarOpen(!sidebarOpen)}>☰</button>
              <h2>{PAGE_TITLES[page]||page}</h2>
            </div>
            <div className="topbar-actions">
              <div className="sync-indicator">
                <div className="sync-dot"/>
                مباشر — Supabase
              </div>
            </div>
          </div>
          <div className="content">
            {renderPage()}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
